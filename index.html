<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="90日學堂">
<meta name="theme-color" content="#1C1F26">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#1C1F26;
    --bg-raised:#242832;
    --bg-input:#2C313D;
    --text:#F7F5F0;
    --text-dim:#B7BAC2;
    --accent:#E8622C;
    --accent-dim:#7A3A22;
    --teal:#2BA89A;
    --gold:#D4A73D;
    --gray:#6B7280;
    --danger:#C0392B;
    --font-display:'Bebas Neue','Noto Sans TC',sans-serif;
    --font-body:'Noto Sans TC',sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(232,98,44,0.10), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(43,168,154,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.08);
    position:sticky;top:0;background:rgba(28,31,38,0.92);backdrop-filter:blur(6px);z-index:10;
  }
  .brand{display:flex;flex-direction:column;line-height:1.05;cursor:pointer;}
  .brand .top{font-family:var(--font-display);font-size:22px;letter-spacing:1px;color:var(--accent);}
  .brand .sub{font-size:11px;color:var(--text-dim);letter-spacing:1px;}
  .navwrap{display:flex;gap:8px;align-items:center;}
  .navlink{
    font-size:13px;color:var(--text-dim);background:transparent;border:1px solid rgba(255,255,255,0.14);
    padding:7px 12px;border-radius:100px;cursor:pointer;font-family:var(--font-body);
  }
  .navlink:active{transform:scale(0.96);}
  .navlink.active{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700;}
  .day-pill{
    font-family:var(--font-display);font-size:15px;color:var(--gold);border:1px solid rgba(212,167,61,0.4);
    padding:5px 12px;border-radius:100px;letter-spacing:0.5px;white-space:nowrap;
  }
  main{flex:1;padding:20px 18px 60px;}
  .card{
    background:var(--bg-raised);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  h1.page-title{font-family:var(--font-display);font-size:30px;letter-spacing:0.5px;margin:4px 0 4px;color:var(--text);}
  h2.section-title{font-family:var(--font-display);font-size:20px;letter-spacing:0.5px;margin:0 0 12px;color:var(--accent);}
  p.helper{color:var(--text-dim);font-size:13px;margin:0 0 18px;line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.3px;}
  .input,select.input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
    background:var(--bg-input);color:var(--text);font-size:16px;font-family:var(--font-body);
  }
  .input:focus{outline:none;border-color:var(--accent);}
  .btn{
    width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;
    cursor:pointer;font-family:var(--font-body);letter-spacing:0.3px;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--accent);color:#1C1F26;}
  .btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--text);}
  .btn-danger{background:transparent;border:1px solid rgba(192,57,43,0.5);color:#E07A6E;}
  .btn-teal{background:var(--teal);color:#08201d;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .role-grid{display:flex;flex-direction:column;gap:12px;margin-top:10px;}
  .role-btn{
    display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--radius);
    background:var(--bg-raised);border:1px solid rgba(255,255,255,0.08);cursor:pointer;text-align:left;
  }
  .role-btn:active{transform:scale(0.98);}
  .role-btn .emoji{font-size:26px;}
  .role-btn .label{font-family:var(--font-display);font-size:19px;letter-spacing:0.5px;}
  .role-btn .desc{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .list-item{
    display:flex;align-items:center;justify-content:space-between;padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:700;font-size:15px;}
  .list-item .meta{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .pill-small{
    font-size:11px;background:var(--bg-input);color:var(--text-dim);padding:3px 9px;border-radius:100px;
  }
  .icon-btn{background:transparent;border:none;color:var(--gray);font-size:18px;cursor:pointer;padding:6px;}
  .icon-btn.danger{color:#E07A6E;}
  .name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
  .name-tile{
    padding:18px 10px;background:var(--bg-raised);border:1px solid rgba(255,255,255,0.08);border-radius:12px;
    text-align:center;font-weight:700;cursor:pointer;font-size:15px;
  }
  .name-tile:active{transform:scale(0.96);border-color:var(--accent);}
  .pin-display{
    display:flex;justify-content:center;gap:10px;margin:20px 0;
  }
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text-dim);}
  .pin-dot.filled{background:var(--accent);border-color:var(--accent);}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .key{
    padding:18px 0;background:var(--bg-raised);border:1px solid rgba(255,255,255,0.1);border-radius:12px;
    font-family:var(--font-display);font-size:22px;color:var(--text);cursor:pointer;text-align:center;
  }
  .key:active{background:var(--accent-dim);}
  .key.wide{font-family:var(--font-body);font-size:13px;color:var(--text-dim);}
  .item-row{margin-bottom:16px;}
  .item-row label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .item-row .unit{color:var(--text-dim);font-size:12px;}
  .num-input{
    width:100%;padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
    background:var(--bg-input);color:var(--text);font-family:var(--font-display);font-size:26px;
    letter-spacing:1px;
  }
  .num-input:focus{outline:none;border-color:var(--accent);}
  .banner{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;}
  .banner.error{background:rgba(192,57,43,0.15);color:#E07A6E;border:1px solid rgba(192,57,43,0.3);}
  .banner.success{background:rgba(43,168,154,0.15);color:#5FD6C6;border:1px solid rgba(43,168,154,0.3);}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{
    flex:1;padding:10px;text-align:center;border-radius:10px;border:1px solid rgba(255,255,255,0.1);
    font-size:13px;font-weight:700;cursor:pointer;color:var(--text-dim);
  }
  .tab.active{background:var(--accent);color:#1C1F26;border-color:var(--accent);}
  .track-row{margin-bottom:22px;}
  .track-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .track-head .gname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;}
  .track-head .rank{font-family:var(--font-display);font-size:13px;color:var(--gold);}
  .track-head .score{font-family:var(--font-display);font-size:20px;color:var(--text);}
  .track{
    position:relative;height:34px;border-radius:100px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 22px), var(--bg-input);
    overflow:hidden;border:1px solid rgba(255,255,255,0.08);
  }
  .track-fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:100px;
    transition:width 0.8s cubic-bezier(.2,.8,.2,1);
  }
  .track-runner{
    position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;transition:left 0.8s cubic-bezier(.2,.8,.2,1);
  }
  .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.6;}
  .empty-state{text-align:center;padding:40px 10px;color:var(--text-dim);}
  .empty-state .big-emoji{font-size:36px;margin-bottom:10px;}
  .divider{height:1px;background:rgba(255,255,255,0.08);margin:18px 0;}
  .status-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .status-chip{font-size:12px;padding:6px 10px;border-radius:100px;display:flex;align-items:center;gap:5px;}
  .status-chip.done{background:rgba(43,168,154,0.15);color:#5FD6C6;}
  .status-chip.pending{background:rgba(255,255,255,0.06);color:var(--text-dim);}
  .refresh-note{text-align:center;font-size:11px;color:var(--gray);margin-top:6px;}
  .link-btn{background:none;border:none;color:var(--text-dim);font-size:12px;text-decoration:underline;cursor:pointer;padding:0;margin-top:4px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- Firebase setup (loaded dynamically so this stays a classic script) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCL_qiL5vlwJg_XFCD2f162GsTrsDhX6b0",
  authDomain: "mm-team-90days.firebaseapp.com",
  projectId: "mm-team-90days",
  storageBucket: "mm-team-90days.firebasestorage.app",
  messagingSenderId: "464972539123",
  appId: "1:464972539123:web:3768436c9e57fe4ef10386"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const dataDocRef = db.collection('mm90').doc('appData');

/* ---------- storage helpers ---------- */
const todayStr = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off*60000).toISOString().slice(0,10);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function defaultData(){
  return {
    adminPin: '9000',
    startDate: todayStr(),
    coaches: [],
    students: [],
    items: [],
    records: []
  };
}

async function loadData(){
  try{
    const snap = await dataDocRef.get();
    if(snap.exists) return snap.data();
    const d = defaultData();
    await dataDocRef.set(d);
    return d;
  }catch(e){
    console.error('loadData error', e);
    return defaultData();
  }
}

async function saveData(data){
  try{
    await dataDocRef.set(data);
    return true;
  }catch(e){
    console.error('saveData error', e);
    return false;
  }
}

/* ---------- state ---------- */
let state = {
  view: 'home',
  data: null,
  loading: true,
  error: '',
  success: '',
  session: null, // {role:'admin'|'coach'|'student', id}
  pinBuffer: '',
  studentFlow: { coachId: null, studentId: null },
  overviewTab: 'today',
  loginError: ''
};

function setState(patch){
  state = { ...state, ...patch };
  render();
}

let firstSnapshot = true;
function boot(){
  dataDocRef.onSnapshot(async (snap)=>{
    if(!snap.exists){
      if(firstSnapshot){
        const d = defaultData();
        await dataDocRef.set(d);
      }
      return;
    }
    const fresh = snap.data();
    if(firstSnapshot){
      firstSnapshot = false;
      setState({ data: fresh, loading:false });
    }else{
      // avoid clobbering an open form on data-entry screens; still keep data fresh in background
      state.data = fresh;
      if(['overview','home','coach','admin'].includes(state.view)) render();
    }
  }, (err)=>{
    console.error('onSnapshot error', err);
    if(firstSnapshot){
      firstSnapshot = false;
      setState({ data: defaultData(), loading:false, error:'連唔到Firebase,請檢查網絡或設定 (F12 睇Console)' });
    }
  });
}

/* ---------- derived helpers ---------- */
function dayNumber(data){
  const start = new Date(data.startDate + 'T00:00:00');
  const now = new Date(todayStr() + 'T00:00:00');
  const diff = Math.floor((now-start)/86400000) + 1;
  return Math.max(1, Math.min(90, diff));
}
function coachById(id){ return state.data.coaches.find(c=>c.id===id); }
function studentById(id){ return state.data.students.find(s=>s.id===id); }
function studentsOfCoach(coachId){ return state.data.students.filter(s=>s.coachId===coachId); }
function itemsOfCoach(coachId){ return state.data.items.filter(i=>i.coachId===coachId); }
function groupTotal(coachId, onlyToday){
  const ids = studentsOfCoach(coachId).map(s=>s.id);
  return state.data.records
    .filter(r => ids.includes(r.studentId) && (!onlyToday || r.date === todayStr()))
    .reduce((sum,r)=> sum + (Number(r.value)||0), 0);
}

/* ---------- actions ---------- */
function goto(view, extra={}){ setState({ view, error:'', success:'', ...extra }); }
function logout(){ setState({ session:null, view:'home', pinBuffer:'', studentFlow:{coachId:null,studentId:null} }); }

async function adminLogin(){
  const pin = document.getElementById('adminPinInput').value.trim();
  if(pin === state.data.adminPin){
    setState({ session:{role:'admin'}, view:'admin', loginError:'' });
  }else{
    setState({ loginError:'PIN 唔啱,請再試' });
  }
}

async function coachLogin(){
  const coachId = document.getElementById('coachSelectInput').value;
  const pw = document.getElementById('coachPwInput').value;
  const coach = coachById(coachId);
  if(coach && coach.password === pw){
    setState({ session:{role:'coach', id:coach.id}, view:'coach', loginError:'' });
  }else{
    setState({ loginError:'教練或密碼唔啱,請再試' });
  }
}

async function addCoach(){
  const name = document.getElementById('newCoachName').value.trim();
  const groupName = document.getElementById('newCoachGroup').value.trim();
  const pw = document.getElementById('newCoachPw').value.trim();
  if(!name || !groupName || !pw){ setState({ error:'請填晒教練名、組名同密碼' }); return; }
  const data = { ...state.data };
  data.coaches = [...data.coaches, { id:uid(), name, groupName, password:pw }];
  const ok = await saveData(data);
  if(ok) setState({ data, success:`已新增教練「${name}」`, error:'' });
  else setState({ error:'儲存失敗,請再試' });
}

async function deleteCoach(id){
  const data = { ...state.data };
  const studentIds = data.students.filter(s=>s.coachId===id).map(s=>s.id);
  data.coaches = data.coaches.filter(c=>c.id!==id);
  data.students = data.students.filter(s=>s.coachId!==id);
  data.items = data.items.filter(i=>i.coachId!==id);
  data.records = data.records.filter(r=>!studentIds.includes(r.studentId));
  const ok = await saveData(data);
  if(ok) setState({ data, confirmDelete:null });
}

async function updateSettings(){
  const startDate = document.getElementById('settingsStartDate').value;
  const newPin = document.getElementById('settingsAdminPin').value.trim();
  const data = { ...state.data };
  if(startDate) data.startDate = startDate;
  if(newPin) data.adminPin = newPin;
  const ok = await saveData(data);
  if(ok) setState({ data, success:'設定已更新' });
}

async function addStudent(){
  const coachId = state.session.id;
  const name = document.getElementById('newStudentName').value.trim();
  let pin = document.getElementById('newStudentPin').value.trim();
  if(!name){ setState({ error:'請輸入學員姓名' }); return; }
  if(!/^\d{4}$/.test(pin)){ setState({ error:'PIN 要係4位數字' }); return; }
  const data = { ...state.data };
  data.students = [...data.students, { id:uid(), name, pin, coachId }];
  const ok = await saveData(data);
  if(ok) setState({ data, success:`已新增學員「${name}」`, error:'' });
  else setState({ error:'儲存失敗,請再試' });
}

async function deleteStudent(id){
  const data = { ...state.data };
  data.students = data.students.filter(s=>s.id!==id);
  data.records = data.records.filter(r=>r.studentId!==id);
  const ok = await saveData(data);
  if(ok) setState({ data });
}

async function addItem(){
  const coachId = state.session.id;
  const name = document.getElementById('newItemName').value.trim();
  const unit = document.getElementById('newItemUnit').value.trim();
  if(!name){ setState({ error:'請輸入項目名稱' }); return; }
  const data = { ...state.data };
  data.items = [...data.items, { id:uid(), name, unit: unit||'次', coachId }];
  const ok = await saveData(data);
  if(ok) setState({ data, success:`已新增項目「${name}」`, error:'' });
  else setState({ error:'儲存失敗,請再試' });
}

async function deleteItem(id){
  const data = { ...state.data };
  data.items = data.items.filter(i=>i.id!==id);
  data.records = data.records.filter(r=>r.itemId!==id);
  const ok = await saveData(data);
  if(ok) setState({ data });
}

function pinPress(digit){
  if(state.pinBuffer.length>=4) return;
  const buf = state.pinBuffer + digit;
  setState({ pinBuffer: buf });
  if(buf.length===4) checkStudentPin(buf);
}
function pinBackspace(){ setState({ pinBuffer: state.pinBuffer.slice(0,-1) }); }

function checkStudentPin(buf){
  const student = studentById(state.studentFlow.studentId);
  if(student && student.pin === buf){
    setState({ session:{role:'student', id:student.id}, view:'student-report', pinBuffer:'', loginError:'' });
  }else{
    setTimeout(()=> setState({ pinBuffer:'', loginError:'PIN 唔啱,請再試' }), 250);
  }
}

async function submitReport(){
  const student = studentById(state.session.id);
  const items = itemsOfCoach(student.coachId);
  const data = { ...state.data };
  const today = todayStr();
  items.forEach(item=>{
    const el = document.getElementById('qty-'+item.id);
    if(!el) return;
    const val = el.value === '' ? null : Number(el.value);
    if(val === null || isNaN(val)) return;
    const existing = data.records.find(r=>r.studentId===student.id && r.itemId===item.id && r.date===today);
    if(existing){ existing.value = val; }
    else { data.records.push({ id:uid(), date:today, studentId:student.id, itemId:item.id, value:val }); }
  });
  const ok = await saveData(data);
  if(ok) setState({ data, success:'今日數字已提交!' });
  else setState({ error:'儲存失敗,請再試' });
}

/* ---------- render ---------- */
function render(){
  const root = document.getElementById('root');
  if(state.loading){
    root.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:var(--font-display);font-size:20px;">載入緊…</div>`;
    return;
  }
  const day = dayNumber(state.data);
  root.innerHTML = `
    <div class="topbar">
      <div class="brand" onclick="goto('home')">
        <div class="top">MM TEAM</div>
        <div class="sub">90日教練學堂</div>
      </div>
      <div class="navwrap">
        <div class="day-pill">DAY ${day}/90</div>
      </div>
    </div>
    <main>
      ${renderSubNav()}
      ${renderView()}
    </main>
  `;
  attachDynamicHandlers();
}

function renderSubNav(){
  if(state.view==='home') return '';
  const showLogout = !!state.session;
  return `
    <div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="navlink ${state.view==='overview'?'active':''}" onclick="goto('overview')">📊 總覽排行榜</button>
      ${showLogout ? `<button class="navlink" onclick="logout()">登出</button>` : `<button class="navlink" onclick="goto('home')">返回主頁</button>`}
    </div>
  `;
}

function renderView(){
  switch(state.view){
    case 'home': return viewHome();
    case 'admin-login': return viewAdminLogin();
    case 'admin': return viewAdmin();
    case 'coach-login': return viewCoachLogin();
    case 'coach': return viewCoach();
    case 'student-pick-group': return viewStudentPickGroup();
    case 'student-pick-name': return viewStudentPickName();
    case 'student-pin': return viewStudentPin();
    case 'student-report': return viewStudentReport();
    case 'overview': return viewOverview();
    default: return viewHome();
  }
}

function viewHome(){
  return `
    <h1 class="page-title">你係邊個角色?</h1>
    <p class="helper">揀返你嘅身份登入,開始今日嘅衝刺。</p>
    <div class="role-grid">
      <div class="role-btn" onclick="goto('admin-login')">
        <div class="emoji">🛡️</div>
        <div><div class="label">Admin</div><div class="desc">管理教練名單同活動設定</div></div>
      </div>
      <div class="role-btn" onclick="goto('coach-login')">
        <div class="emoji">🧭</div>
        <div><div class="label">教練 / 組長</div><div class="desc">管理組員同每日行動項目</div></div>
      </div>
      <div class="role-btn" onclick="goto('student-pick-group')">
        <div class="emoji">🏃</div>
        <div><div class="label">學員</div><div class="desc">填報今日行動數字</div></div>
      </div>
      <div class="role-btn" onclick="goto('overview')">
        <div class="emoji">🏁</div>
        <div><div class="label">睇總覽排行榜</div><div class="desc">唔使登入都睇到</div></div>
      </div>
    </div>
  `;
}

function viewAdminLogin(){
  return `
    <h1 class="page-title">Admin 登入</h1>
    ${state.loginError ? `<div class="banner error">${state.loginError}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>Admin PIN</label>
        <input class="input" id="adminPinInput" type="password" inputmode="numeric" placeholder="輸入 PIN">
      </div>
      <button class="btn btn-primary" onclick="adminLogin()">登入</button>
    </div>
  `;
}

function viewCoachLogin(){
  const coaches = state.data.coaches;
  if(coaches.length===0){
    return `<div class="empty-state"><div class="big-emoji">🧭</div>暫時未有教練帳號,<br>請聯絡 Admin 新增。</div>`;
  }
  return `
    <h1 class="page-title">教練登入</h1>
    ${state.loginError ? `<div class="banner error">${state.loginError}</div>` : ''}
    <div class="card">
      <div class="field">
        <label>揀返你自己</label>
        <select class="input" id="coachSelectInput">
          ${coaches.map(c=>`<option value="${c.id}">${c.name}（${c.groupName}）</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>密碼</label>
        <input class="input" id="coachPwInput" type="password" placeholder="輸入密碼">
      </div>
      <button class="btn btn-primary" onclick="coachLogin()">登入</button>
    </div>
  `;
}

function viewAdmin(){
  const d = state.data;
  return `
    <h1 class="page-title">Admin 後台</h1>
    ${state.error?`<div class="banner error">${state.error}</div>`:''}
    ${state.success?`<div class="banner success">${state.success}</div>`:''}

    <div class="card">
      <h2 class="section-title">活動設定</h2>
      <div class="field">
        <label>90日開始日期</label>
        <input class="input" id="settingsStartDate" type="date" value="${d.startDate}">
      </div>
      <div class="field">
        <label>更改 Admin PIN（留空即唔改）</label>
        <input class="input" id="settingsAdminPin" type="text" inputmode="numeric" placeholder="新 PIN">
      </div>
      <button class="btn btn-outline" onclick="updateSettings()">儲存設定</button>
    </div>

    <div class="card">
      <h2 class="section-title">新增教練</h2>
      <div class="field"><label>教練姓名</label><input class="input" id="newCoachName" placeholder="例:陳教練"></div>
      <div class="field"><label>組名</label><input class="input" id="newCoachGroup" placeholder="例:烈焰組"></div>
      <div class="field"><label>登入密碼</label><input class="input" id="newCoachPw" type="text" placeholder="設定密碼"></div>
      <button class="btn btn-primary" onclick="addCoach()">新增教練</button>
    </div>

    <div class="card">
      <h2 class="section-title">教練名單（${d.coaches.length}）</h2>
      ${d.coaches.length===0 ? `<div class="empty-state">未有教練,喺上面新增第一個啦。</div>` :
        d.coaches.map(c=>`
          <div class="list-item">
            <div>
              <div class="name">${c.name} <span class="pill-small">${c.groupName}</span></div>
              <div class="meta">${studentsOfCoach(c.id).length} 位學員 · ${itemsOfCoach(c.id).length} 個項目</div>
            </div>
            <button class="icon-btn danger" onclick="if(confirm('確定刪除教練「${c.name}」？佢嘅組員同紀錄都會一齊刪除。')) deleteCoach('${c.id}')">刪除</button>
          </div>
        `).join('')
      }
    </div>
  `;
}

function viewCoach(){
  const coach = coachById(state.session.id);
  if(!coach){ return `<div class="empty-state">搵唔到呢個教練帳號。</div>`; }
  const students = studentsOfCoach(coach.id);
  const items = itemsOfCoach(coach.id);
  const today = todayStr();
  return `
    <h1 class="page-title">${coach.groupName}</h1>
    <p class="helper">教練：${coach.name}</p>
    ${state.error?`<div class="banner error">${state.error}</div>`:''}
    ${state.success?`<div class="banner success">${state.success}</div>`:''}

    <div class="card">
      <h2 class="section-title">今日填報狀況</h2>
      ${students.length===0 ? `<p class="helper">未有學員。</p>` : `
        <div class="status-grid">
          ${students.map(s=>{
            const done = state.data.records.some(r=>r.studentId===s.id && r.date===today);
            return `<div class="status-chip ${done?'done':'pending'}">${done?'✅':'⏳'} ${s.name}</div>`;
          }).join('')}
        </div>
      `}
    </div>

    <div class="card">
      <h2 class="section-title">學員管理（${students.length}）</h2>
      ${students.map(s=>`
        <div class="list-item">
          <div>
            <div class="name">${s.name}</div>
            <div class="meta">PIN: ${s.pin}</div>
          </div>
          <button class="icon-btn danger" onclick="if(confirm('確定刪除學員「${s.name}」？')) deleteStudent('${s.id}')">刪除</button>
        </div>
      `).join('')}
      <div class="divider"></div>
      <div class="field"><label>學員姓名</label><input class="input" id="newStudentName" placeholder="例:黃小明"></div>
      <div class="field"><label>4位數字 PIN</label><input class="input" id="newStudentPin" inputmode="numeric" maxlength="4" placeholder="例:1234"></div>
      <button class="btn btn-primary" onclick="addStudent()">新增學員</button>
    </div>

    <div class="card">
      <h2 class="section-title">每日行動項目（${items.length}）</h2>
      ${items.map(i=>`
        <div class="list-item">
          <div><div class="name">${i.name}</div><div class="meta">單位：${i.unit}</div></div>
          <button class="icon-btn danger" onclick="if(confirm('確定刪除項目「${i.name}」？')) deleteItem('${i.id}')">刪除</button>
        </div>
      `).join('')}
      <div class="divider"></div>
      <div class="field"><label>項目名稱</label><input class="input" id="newItemName" placeholder="例:致電客戶"></div>
      <div class="field"><label>單位</label><input class="input" id="newItemUnit" placeholder="例:次 / 分鐘 / 元"></div>
      <button class="btn btn-primary" onclick="addItem()">新增項目</button>
    </div>
  `;
}

function viewStudentPickGroup(){
  const coaches = state.data.coaches;
  if(coaches.length===0){
    return `<div class="empty-state"><div class="big-emoji">🏃</div>暫時未有任何組別,<br>請聯絡教練或 Admin。</div>`;
  }
  return `
    <h1 class="page-title">揀返你嘅組</h1>
    <div class="name-grid">
      ${coaches.map(c=>`<div class="name-tile" onclick="goto('student-pick-name',{studentFlow:{coachId:'${c.id}',studentId:null}})">${c.groupName}</div>`).join('')}
    </div>
  `;
}

function viewStudentPickName(){
  const students = studentsOfCoach(state.studentFlow.coachId);
  const coach = coachById(state.studentFlow.coachId);
  if(students.length===0){
    return `<div class="empty-state">「${coach?coach.groupName:''}」暫時未有學員,<br>請聯絡教練新增。</div>`;
  }
  return `
    <h1 class="page-title">揀返你個名</h1>
    <p class="helper">${coach.groupName}</p>
    <div class="name-grid">
      ${students.map(s=>`<div class="name-tile" onclick="goto('student-pin',{studentFlow:{...state.studentFlow,studentId:'${s.id}'},pinBuffer:''})">${s.name}</div>`).join('')}
    </div>
    <button class="link-btn" style="margin-top:18px;" onclick="goto('student-pick-group')">← 返上一步揀組</button>
  `;
}

function viewStudentPin(){
  const student = studentById(state.studentFlow.studentId);
  const dots = [0,1,2,3].map(i=>`<div class="pin-dot ${state.pinBuffer.length>i?'filled':''}"></div>`).join('');
  return `
    <h1 class="page-title">你好,${student?student.name:''}</h1>
    <p class="helper">請輸入你嘅4位數字 PIN</p>
    ${state.loginError ? `<div class="banner error">${state.loginError}</div>` : ''}
    <div class="pin-display">${dots}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="key" onclick="pinPress('${n}')">${n}</div>`).join('')}
      <div class="key wide" onclick="goto('student-pick-name')">返回</div>
      <div class="key" onclick="pinPress('0')">0</div>
      <div class="key wide" onclick="pinBackspace()">⌫</div>
    </div>
  `;
}

function viewStudentReport(){
  const student = studentById(state.session.id);
  const items = itemsOfCoach(student.coachId);
  const today = todayStr();
  return `
    <h1 class="page-title">${student.name},今日點衝刺?</h1>
    <p class="helper">${coachById(student.coachId).groupName} · ${today}</p>
    ${state.error?`<div class="banner error">${state.error}</div>`:''}
    ${state.success?`<div class="banner success">${state.success}</div>`:''}
    <div class="card">
      ${items.length===0 ? `<p class="helper">教練未加行動項目,請聯絡教練。</p>` : items.map(item=>{
        const existing = state.data.records.find(r=>r.studentId===student.id && r.itemId===item.id && r.date===today);
        return `
          <div class="item-row">
            <label><span>${item.name}</span><span class="unit">單位：${item.unit}</span></label>
            <input class="num-input" id="qty-${item.id}" type="number" min="0" inputmode="numeric" placeholder="0" value="${existing?existing.value:''}">
          </div>
        `;
      }).join('')}
      ${items.length>0 ? `<button class="btn btn-primary" onclick="submitReport()">提交今日數字</button>` : ''}
    </div>
  `;
}

function viewOverview(){
  const d = state.data;
  const coaches = d.coaches;
  const tab = state.overviewTab;
  if(coaches.length===0){
    return `<div class="empty-state"><div class="big-emoji">🏁</div>暫時未有組別數據。</div>`;
  }
  const rows = coaches.map(c=>({
    coach:c,
    score: groupTotal(c.id, tab==='today')
  })).sort((a,b)=>b.score-a.score);
  const maxScore = Math.max(1, ...rows.map(r=>r.score));
  const palette = ['#E8622C','#2BA89A','#D4A73D','#6B7280','#8E5FE8','#4E8FE8'];
  return `
    <h1 class="page-title">總覽排行榜</h1>
    <div class="tabs">
      <div class="tab ${tab==='today'?'active':''}" onclick="setState({overviewTab:'today'})">今日</div>
      <div class="tab ${tab==='cumulative'?'active':''}" onclick="setState({overviewTab:'cumulative'})">累計 (90日)</div>
    </div>
    <div class="card">
      ${rows.map((r,idx)=>{
        const pct = Math.max(4, Math.round((r.score/maxScore)*92));
        const color = palette[idx % palette.length];
        return `
          <div class="track-row">
            <div class="track-head">
              <div class="gname">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'　'} ${r.coach.groupName}
                <span class="pill-small">${r.coach.name}</span>
              </div>
              <div class="score">${r.score}</div>
            </div>
            <div class="track">
              <div class="track-fill" style="width:${pct}%;background:${color}22;border-right:2px solid ${color};"></div>
              <div class="track-runner" style="left:${pct}%;">🏃</div>
              <div class="flag">🏁</div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="refresh-note">數據即時同步 · <span onclick="(async()=>{const fresh=await loadData();state.data=fresh;render();})()" style="text-decoration:underline;cursor:pointer;">立即重新整理</span></div>
  `;
}

function attachDynamicHandlers(){
  // enter-key submit convenience for a couple of key inputs
  const map = [
    ['adminPinInput','adminLogin'],
    ['coachPwInput','coachLogin'],
  ];
  map.forEach(([id,fn])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') window[fn](); });
  });
}

boot();
</script>
</body>
</html>
