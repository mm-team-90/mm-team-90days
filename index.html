<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* =========================================================
   1) FIREBASE CONFIG — 填返你自己個Firebase project設定
   （Firebase Console → 專案設定 → 你嘅App → SDK設定同設定）

const firebaseConfig = {
  apiKey: "AIzaSyD1NrCkR7QnNYleSAbj7BdcNIvuROgOrv4",
  authDomain: "moneymoney-63abc.firebaseapp.com",
  projectId: "moneymoney-63abc",
  storageBucket: "moneymoney-63abc.firebasestorage.app",
  messagingSenderId: "421869721725",
  appId: "1:421869721725:web:8b414e11ff53e95c327914",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ---------- helpers ---------- */
const fmt = (n) => (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString("zh-HK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayStr = () => new Date().toISOString().slice(0, 10);
function getWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  return monday.toISOString().slice(0, 10);
}
function weekLabel(mondayStr) {
  const m = new Date(mondayStr + "T00:00:00");
  const s = new Date(m); s.setDate(m.getDate() + 6);
  const f = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  return `${f(m)} - ${f(s)}`;
}
const DEFAULT_TIERS = [
  { id: "t1", label: "原價", value: 0 },
  { id: "t2", label: "75折", value: 0 },
  { id: "t3", label: "65折", value: 0 },
];
const LOW_STOCK_THRESHOLD = 5;

/* tiny inline icons */
const Icon = ({ children, size = 16, color = "currentColor", style }) => (
  <span style={{ fontSize: size, color, lineHeight: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", ...style }}>{children}</span>
);
const IPlus = (p) => <Icon {...p}>＋</Icon>;
const ITrash = (p) => <Icon {...p}>🗑</Icon>;
const ICart = (p) => <Icon {...p}>🛒</Icon>;
const IBox = (p) => <Icon {...p}>📦</Icon>;
const IChart = (p) => <Icon {...p}>📊</Icon>;
const ISettings = (p) => <Icon {...p}>⚙️</Icon>;
const IX = (p) => <Icon {...p}>✕</Icon>;
const IChevronDown = (p) => <Icon {...p}>▾</Icon>;
const IChevronRight = (p) => <Icon {...p}>▸</Icon>;

/* =========================================================
   AUTH GATE
   ========================================================= */
function AuthGate() {
  const [user, setUser] = useState(undefined); // undefined = loading, null = signed out
  const [role, setRole] = useState(null);
  const [roleLoading, setRoleLoading] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (u) => {
      setUser(u);
      if (u) {
        setRoleLoading(true);
        try {
          const snap = await db.collection("roles").doc(u.uid).get();
          setRole(snap.exists ? snap.data() : null);
        } catch (e) {
          setRole(null);
        }
        setRoleLoading(false);
      } else {
        setRole(null);
      }
    });
    return unsub;
  }, []);

  if (user === undefined) return <ScreenCenter><Loader /></ScreenCenter>;
  if (!user) return <LoginScreen />;
  if (roleLoading) return <ScreenCenter><Loader /></ScreenCenter>;
  if (!role) {
    return (
      <ScreenCenter>
        <div style={{ textAlign: "center", padding: 24 }}>
          <div style={{ fontSize: 15, color: "#7a6f5c", marginBottom: 6 }}>未有權限</div>
          <div style={{ fontSize: 12, color: "#a89b86", marginBottom: 16 }}>你嘅帳戶未設定角色，請聯絡管理員喺「roles」加返你嘅UID</div>
          <div style={{ fontSize: 11, color: "#c4b8a0", marginBottom: 16, fontFamily: "monospace", wordBreak: "break-all" }}>UID: {user.uid}</div>
          <button onClick={() => auth.signOut()} style={styles.smallBtn}>登出</button>
        </div>
      </ScreenCenter>
    );
  }
  return <App user={user} role={role} />;
}

function ScreenCenter({ children }) {
  return <div style={{ height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#fdf8ef" }}>{children}</div>;
}
function Loader() {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
      <div style={styles.loadingMark}>H</div>
      <div style={{ color: "#8a7f6a", fontSize: 13 }}>載入中…</div>
    </div>
  );
}

function LoginScreen() {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const handleLogin = async () => {
    setError(""); setBusy(true);
    try {
      const email = username.trim().toLowerCase().replace(/\s+/g, "") + "@moneymoney.local";
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      setError(`登入失敗 [${e.code || "unknown"}]：${e.message}`);
    }
    setBusy(false);
  };

  return (
    <ScreenCenter>
      <div style={{ width: "88%", maxWidth: 340 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 26 }}>
          <div style={styles.loadingMark}>H</div>
          <div style={{ marginTop: 10, fontWeight: 800, fontSize: 16, color: "#3a3327" }}>moneymoney 記帳</div>
        </div>
        <label style={styles.label}>帳戶名</label>
        <input style={styles.input} value={username} onChange={(e) => setUsername(e.target.value)} placeholder="例如：raymond" autoCapitalize="none" />
        <label style={styles.label}>密碼</label>
        <input style={styles.input} type="password" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleLogin()} />
        {error && <div style={{ color: "#a85454", fontSize: 12, marginTop: 8 }}>{error}</div>}
        <button onClick={handleLogin} disabled={busy} style={{ ...styles.submitBtn, marginTop: 18, opacity: busy ? 0.6 : 1 }}>{busy ? "登入緊…" : "登入"}</button>
        <div style={{ fontSize: 11, color: "#a89b86", marginTop: 14, textAlign: "center", lineHeight: 1.5 }}>
          帳戶由管理員喺Firebase Console開設<br />未有帳戶請聯絡管理員
        </div>
      </div>
    </ScreenCenter>
  );
}

/* =========================================================
   MAIN APP
   ========================================================= */
function App({ user, role }) {
  const isAdmin = role.role === "admin";
  const [tab, setTab] = useState("order");
  const [toast, setToast] = useState(null);
  const showToast = useCallback((msg) => { setToast(msg); setTimeout(() => setToast(null), 1800); }, []);

  const [products, setProducts] = useState([]);
  const [productsLoaded, setProductsLoaded] = useState(false);
  const [costs, setCosts] = useState({}); // productId -> cost, admin only
  const [orders, setOrders] = useState([]);
  const [purchases, setPurchases] = useState([]);

  useEffect(() => {
    const unsub = db.collection("products").onSnapshot((snap) => {
      const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      list.sort((a, b) => (a.name || "").localeCompare(b.name || "", "zh-Hant"));
      setProducts(list);
      setProductsLoaded(true);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!isAdmin) return;
    const unsub = db.collection("productCosts").onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { m[d.id] = d.data().cost || 0; });
      setCosts(m);
    });
    return unsub;
  }, [isAdmin]);

  useEffect(() => {
    const unsub = db.collection("orders").orderBy("createdAt", "desc").limit(500).onSnapshot((snap) => {
      setOrders(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!isAdmin) return;
    const unsub = db.collection("purchases").orderBy("createdAt", "desc").limit(500).onSnapshot((snap) => {
      setPurchases(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [isAdmin]);

  if (!productsLoaded) return <ScreenCenter><Loader /></ScreenCenter>;

  const tabs = isAdmin
    ? [
        { id: "order", label: "開單", icon: ICart },
        { id: "purchase", label: "入貨", icon: IBox },
        { id: "products", label: "產品", icon: IBox },
        { id: "stats", label: "統計", icon: IChart },
        { id: "settings", label: "設定", icon: ISettings },
      ]
    : [
        { id: "order", label: "開單", icon: ICart },
        { id: "products", label: "產品", icon: IBox },
        { id: "stats", label: "統計", icon: IChart },
      ];

  return (
    <div style={styles.app}>
      <Header role={role} user={user} />
      <div style={styles.body}>
        {tab === "order" && <OrderTab products={products} orders={orders} isAdmin={isAdmin} role={role} user={user} showToast={showToast} />}
        {tab === "purchase" && isAdmin && <PurchaseTab products={products} costs={costs} purchases={purchases} showToast={showToast} />}
        {tab === "products" && <ProductsTab products={products} costs={costs} isAdmin={isAdmin} showToast={showToast} />}
        {tab === "stats" && <StatsTab orders={orders} purchases={purchases} products={products} costs={costs} isAdmin={isAdmin} />}
        {tab === "settings" && isAdmin && <SettingsTab products={products} costs={costs} orders={orders} purchases={purchases} showToast={showToast} />}
      </div>
      <NavBar tab={tab} setTab={setTab} tabs={tabs} />
      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

/* =========================================================
   ORDER TAB — 開單 (multi-item cart, stock aware)
   ========================================================= */
function OrderTab({ products, orders, isAdmin, role, user, showToast }) {
  const [cart, setCart] = useState([]); // {productId, productName, tierId, tierLabel, unitPrice, qty}
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayStr());
  const [pickerProductId, setPickerProductId] = useState(products[0]?.id || "");

  useEffect(() => {
    if (products.length && !products.find((p) => p.id === pickerProductId)) setPickerProductId(products[0].id);
  }, [products]); // eslint-disable-line

  const pickerProduct = products.find((p) => p.id === pickerProductId);
  const [pickerTierId, setPickerTierId] = useState("");
  const [pickerQty, setPickerQty] = useState("1");

  useEffect(() => {
    if (pickerProduct?.priceTiers?.length) setPickerTierId(pickerProduct.priceTiers[0].id);
  }, [pickerProductId]); // eslint-disable-line

  const addToCart = () => {
    if (!pickerProduct) return;
    const tier = pickerProduct.priceTiers.find((t) => t.id === pickerTierId);
    const qty = parseFloat(pickerQty) || 0;
    if (qty <= 0) { showToast("請輸入數量"); return; }
    if (!tier || tier.value <= 0) { showToast("請揀有效嘅售價級別"); return; }
    setCart((c) => [...c, {
      key: Date.now() + Math.random(),
      productId: pickerProduct.id,
      productName: pickerProduct.name,
      tierId: tier.id,
      tierLabel: tier.label,
      unitPrice: tier.value,
      qty,
      stockAtAdd: pickerProduct.stock || 0,
    }]);
    setPickerQty("1");
  };

  const removeFromCart = (key) => setCart((c) => c.filter((i) => i.key !== key));

  const cartTotal = cart.reduce((s, i) => s + i.unitPrice * i.qty, 0);

  // aggregate qty per product in cart, to warn about stock
  const qtyByProduct = useMemo(() => {
    const m = {};
    cart.forEach((i) => { m[i.productId] = (m[i.productId] || 0) + i.qty; });
    return m;
  }, [cart]);

  const submitOrder = async () => {
    if (cart.length === 0) { showToast("購物車係空嘅"); return; }
    try {
      await db.runTransaction(async (tx) => {
        const productRefs = {};
        for (const pid of Object.keys(qtyByProduct)) {
          const ref = db.collection("products").doc(pid);
          const snap = await tx.get(ref);
          productRefs[pid] = { ref, data: snap.data() };
        }
        const orderRef = db.collection("orders").doc();
        tx.set(orderRef, {
          date, note: note.trim(),
          items: cart.map(({ key, stockAtAdd, ...rest }) => rest),
          total: cartTotal,
          status: "completed",
          staffUid: user.uid, staffName: role.name || user.email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
        for (const pid of Object.keys(qtyByProduct)) {
          const cur = productRefs[pid].data.stock || 0;
          tx.update(productRefs[pid].ref, { stock: cur - qtyByProduct[pid] });
        }
      });
      showToast("已完成落單");
      setCart([]); setNote("");
    } catch (e) {
      showToast("落單失敗：" + e.message);
    }
  };

  if (!products.length) {
    return (
      <div style={styles.emptyState}>
        <IBox size={34} />
        <div style={{ marginTop: 10, color: "#7a6f5c", fontSize: 14 }}>未有產品</div>
        {isAdmin && <div style={{ color: "#a89b86", fontSize: 12, marginTop: 4 }}>先去「產品」分頁新增產品</div>}
      </div>
    );
  }

  const recent = orders.slice(0, 6);

  const cancelOrder = async (order) => {
    if (!window.confirm("確定取消呢張單？存貨會加返。")) return;
    try {
      await db.runTransaction(async (tx) => {
        const productRefs = {};
        for (const it of order.items || []) {
          if (!productRefs[it.productId]) {
            const ref = db.collection("products").doc(it.productId);
            const snap = await tx.get(ref);
            productRefs[it.productId] = { ref, data: snap.data() };
          }
        }
        const orderRef = db.collection("orders").doc(order.id);
        tx.update(orderRef, { status: "cancelled" });
        const qtyByProduct = {};
        (order.items || []).forEach((it) => { qtyByProduct[it.productId] = (qtyByProduct[it.productId] || 0) + it.qty; });
        for (const pid of Object.keys(qtyByProduct)) {
          if (!productRefs[pid]) continue;
          const cur = productRefs[pid].data.stock || 0;
          tx.update(productRefs[pid].ref, { stock: cur + qtyByProduct[pid] });
        }
      });
      showToast("已取消，存貨已加返");
    } catch (e) {
      showToast("取消失敗：" + e.message);
    }
  };

  return (
    <div style={styles.tabContent}>
      <div style={styles.card}>
        <label style={styles.label}>加產品</label>
        <select style={styles.select} value={pickerProductId} onChange={(e) => setPickerProductId(e.target.value)}>
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}（存{p.stock ?? 0}{(p.stock ?? 0) <= LOW_STOCK_THRESHOLD ? " ⚠️" : ""}）</option>)}
        </select>

        {pickerProduct?.priceTiers?.length > 0 && (
          <React.Fragment>
            <label style={styles.label}>售價級別</label>
            <div style={styles.tierRow}>
              {pickerProduct.priceTiers.map((t) => (
                <button key={t.id} onClick={() => setPickerTierId(t.id)}
                  style={{ ...styles.tierChip, borderColor: pickerTierId === t.id ? "#1f8f56" : "#e4dbc9", background: pickerTierId === t.id ? "#eef4f0" : "#fff", color: pickerTierId === t.id ? "#1f8f56" : "#7a6f5c" }}>
                  <div style={{ fontWeight: 700 }}>{t.label}</div>
                  <div style={{ fontSize: 11, opacity: 0.8 }}>${fmt(t.value)}</div>
                </button>
              ))}
            </div>
          </React.Fragment>
        )}

        <div style={styles.rowGap}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <label style={styles.label}>數量</label>
            <input style={styles.input} type="number" inputMode="decimal" value={pickerQty} onChange={(e) => setPickerQty(e.target.value)} />
          </div>
          <div style={{ flex: 1, display: "flex", alignItems: "flex-end" }}>
            <button onClick={addToCart} style={{ ...styles.submitBtn, marginTop: 0, padding: "10px 0" }}><IPlus size={15} /> 加入</button>
          </div>
        </div>
      </div>

      {cart.length > 0 && (
        <div style={{ ...styles.card, marginTop: 14 }}>
          <div style={styles.sectionTitle}>本張單 ({cart.length}項)</div>
          {cart.map((i) => {
            const shortStock = (qtyByProduct[i.productId] || 0) > (i.stockAtAdd ?? 0);
            return (
              <div key={i.key} style={styles.cartRow}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: "#3a3327" }}>{i.productName} <span style={{ fontSize: 11, color: "#a89b86" }}>· {i.tierLabel}</span></div>
                  <div style={{ fontSize: 11, color: shortStock ? "#a85454" : "#a89b86" }}>{i.qty} 件 × ${fmt(i.unitPrice)} {shortStock && "· 存貨可能不足"}</div>
                </div>
                <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#1f8f56" }}>${fmt(i.unitPrice * i.qty)}</div>
                <button onClick={() => removeFromCart(i.key)} style={styles.deleteBtn}><IX size={13} color="#c4b8a0" /></button>
              </div>
            );
          })}

          <div style={styles.rowGap}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <label style={styles.label}>日期</label>
              <input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <label style={styles.label}>客戶/備註</label>
              <input style={styles.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="可選" />
            </div>
          </div>

          <div style={styles.totalBar}>
            <span style={{ color: "#8a7f6a", fontSize: 13 }}>合計</span>
            <span style={{ fontSize: 22, fontWeight: 800, color: "#1f8f56", fontFamily: "monospace" }}>${fmt(cartTotal)}</span>
          </div>
          <button onClick={submitOrder} style={styles.submitBtn}>完成落單</button>
        </div>
      )}

      <div style={{ marginTop: 22 }}>
        <div style={styles.sectionTitle}>最近落單</div>
        {recent.length === 0 && <div style={styles.emptyHint}>未有記錄</div>}
        {recent.map((o) => <OrderRow key={o.id} order={o} isAdmin={isAdmin} onCancel={cancelOrder} />)}
      </div>
    </div>
  );
}

function OrderRow({ order, isAdmin, onCancel }) {
  const cancelled = order.status === "cancelled";
  return (
    <div style={{ ...styles.txRow, alignItems: "flex-start", opacity: cancelled ? 0.5 : 1 }}>
      <div style={{ ...styles.txDot, background: cancelled ? "#a89b86" : "#1f8f56", marginTop: 5 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, color: "#3a3327", fontWeight: 600, textDecoration: cancelled ? "line-through" : "none" }}>
          {(order.items || []).map((i) => `${i.productName}×${i.qty}`).join("、")}
        </div>
        <div style={{ fontSize: 11, color: "#a89b86" }}>
          {order.date} · {order.staffName || ""} {order.note && `· ${order.note}`} {cancelled && "· 已取消"}
        </div>
      </div>
      <div style={{ fontFamily: "monospace", fontWeight: 700, color: cancelled ? "#a89b86" : "#1f8f56", fontSize: 14 }}>+${fmt(order.total)}</div>
      {isAdmin && !cancelled && onCancel && (
        <button onClick={() => onCancel(order)} style={styles.deleteBtn}><ITrash size={13} color="#c4b8a0" /></button>
      )}
    </div>
  );
}

/* =========================================================
   PURCHASE TAB — 入貨 (admin only, adds stock)
   ========================================================= */
function PurchaseTab({ products, costs, purchases, showToast }) {
  const [productId, setProductId] = useState(products[0]?.id || "");
  const [qty, setQty] = useState("1");
  const [unitCost, setUnitCost] = useState("");
  const [updateBaseCost, setUpdateBaseCost] = useState(false);
  const [date, setDate] = useState(todayStr());
  const [note, setNote] = useState("");

  useEffect(() => {
    if (products.length && !products.find((p) => p.id === productId)) setProductId(products[0].id);
  }, [products]); // eslint-disable-line

  const product = products.find((p) => p.id === productId);
  useEffect(() => { if (product) setUnitCost(String(costs[product.id] ?? 0)); }, [productId]); // eslint-disable-line

  const qtyNum = parseFloat(qty) || 0;
  const costNum = parseFloat(unitCost) || 0;
  const total = qtyNum * costNum;

  const submit = async () => {
    if (!product) return;
    if (qtyNum <= 0) { showToast("請輸入數量"); return; }
    if (costNum < 0) { showToast("成本唔可以係負數"); return; }
    try {
      const batch = db.batch();
      const purchaseRef = db.collection("purchases").doc();
      batch.set(purchaseRef, {
        productId: product.id, productName: product.name, qty: qtyNum, unitCost: costNum, total, date, note: note.trim(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      const prodRef = db.collection("products").doc(product.id);
      batch.update(prodRef, { stock: (product.stock || 0) + qtyNum });
      if (updateBaseCost) {
        const costRef = db.collection("productCosts").doc(product.id);
        batch.set(costRef, { cost: costNum }, { merge: true });
      }
      await batch.commit();
      showToast("已記錄入貨，存貨已更新");
      setQty("1"); setNote("");
    } catch (e) {
      showToast("失敗：" + e.message);
    }
  };

  if (!products.length) return <div style={styles.emptyState}><IBox size={34} /><div style={{ marginTop: 10, color: "#7a6f5c", fontSize: 14 }}>先去「產品」新增產品</div></div>;

  const recent = purchases.slice(0, 8);

  return (
    <div style={styles.tabContent}>
      <div style={styles.card}>
        <label style={styles.label}>產品</label>
        <select style={styles.select} value={productId} onChange={(e) => setProductId(e.target.value)}>
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}（現存{p.stock ?? 0}）</option>)}
        </select>

        <div style={styles.rowGap}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <label style={styles.label}>入貨數量</label>
            <input style={styles.input} type="number" inputMode="decimal" value={qty} onChange={(e) => setQty(e.target.value)} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <label style={styles.label}>單件成本</label>
            <input style={styles.input} type="number" inputMode="decimal" value={unitCost} onChange={(e) => setUnitCost(e.target.value)} />
          </div>
        </div>

        <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12, fontSize: 12, color: "#7a6f5c" }}>
          <input type="checkbox" checked={updateBaseCost} onChange={(e) => setUpdateBaseCost(e.target.checked)} />
          同時將呢個價更新做產品嘅基本成本
        </label>

        <div style={styles.rowGap}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <label style={styles.label}>日期</label>
            <input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <label style={styles.label}>備註</label>
            <input style={styles.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="可選" />
          </div>
        </div>

        <div style={styles.totalBar}>
          <span style={{ color: "#8a7f6a", fontSize: 13 }}>入貨總額</span>
          <span style={{ fontSize: 22, fontWeight: 800, color: "#16261f", fontFamily: "monospace" }}>${fmt(total)}</span>
        </div>
        <button onClick={submit} style={styles.submitBtn}><IPlus size={17} /> 記錄入貨</button>
      </div>

      <div style={{ marginTop: 22 }}>
        <div style={styles.sectionTitle}>最近入貨</div>
        {recent.length === 0 && <div style={styles.emptyHint}>未有記錄</div>}
        {recent.map((p) => (
          <div key={p.id} style={styles.txRow}>
            <div style={{ ...styles.txDot, background: "#16261f" }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: "#3a3327" }}>{p.productName}</div>
              <div style={{ fontSize: 11, color: "#a89b86" }}>{p.date} · {p.qty}件 × ${fmt(p.unitCost)} {p.note && `· ${p.note}`}</div>
            </div>
            <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#16261f", fontSize: 14 }}>-${fmt(p.total)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================
   PRODUCTS TAB — 產品管理（admin全功能，店員睇存貨/售價，唔見成本）
   ========================================================= */
function ProductsTab({ products, costs, isAdmin, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const openNew = () => setEditing({ id: null, name: "", category: "", cost: "", stock: "0", priceTiers: DEFAULT_TIERS.map((t) => ({ ...t, id: t.id + Math.random(), value: "" })) }) || setShowForm(true);
  const openEdit = (p) => {
    setEditing({ id: p.id, name: p.name, category: p.category || "", cost: String(costs[p.id] ?? 0), stock: String(p.stock ?? 0), priceTiers: p.priceTiers.map((t) => ({ ...t, value: String(t.value) })) });
    setShowForm(true);
  };

  const handleSave = async () => {
    if (!editing.name.trim()) { showToast("請輸入產品名稱"); return; }
    const cleanTiers = editing.priceTiers.map((t) => ({ id: String(t.id), label: t.label.trim() || "級別", value: parseFloat(t.value) || 0 }));
    const data = { name: editing.name.trim(), category: editing.category.trim() || "未分類", priceTiers: cleanTiers, stock: parseFloat(editing.stock) || 0 };
    try {
      let pid = editing.id;
      if (pid) {
        await db.collection("products").doc(pid).update(data);
      } else {
        const ref = await db.collection("products").add(data);
        pid = ref.id;
      }
      await db.collection("productCosts").doc(pid).set({ cost: parseFloat(editing.cost) || 0 }, { merge: true });
      setShowForm(false); setEditing(null);
      showToast("已儲存產品");
    } catch (e) {
      showToast("儲存失敗：" + e.message);
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm("確定刪除呢個產品？（唔會刪走已經落咗嘅單記錄）")) return;
    try {
      await db.collection("products").doc(id).delete();
      showToast("已刪除產品");
    } catch (e) { showToast("刪除失敗：" + e.message); }
  };

  const lowStock = products.filter((p) => (p.stock ?? 0) <= LOW_STOCK_THRESHOLD);

  return (
    <div style={styles.tabContent}>
      {lowStock.length > 0 && (
        <div style={styles.lowStockBanner}>
          ⚠️ 存貨偏低（≤{LOW_STOCK_THRESHOLD}件）：{lowStock.map((p) => p.name).join("、")}
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={styles.sectionTitle}>產品列表</div>
        {isAdmin && <button onClick={openNew} style={styles.addProductBtn}><IPlus size={14} /> 新增產品</button>}
      </div>

      {products.length === 0 && <div style={styles.emptyState}><IBox size={34} /><div style={{ marginTop: 10, color: "#7a6f5c", fontSize: 14 }}>未有產品</div></div>}

      {products.map((p) => (
        <div key={p.id} style={styles.productCard}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#3a3327" }}>{p.name}</div>
              <div style={{ fontSize: 12, color: "#a89b86", marginTop: 2 }}>
                {p.category || "未分類"} · 存貨 <b style={{ color: (p.stock ?? 0) <= LOW_STOCK_THRESHOLD ? "#a85454" : "#3a3327" }}>{p.stock ?? 0}</b>{(p.stock ?? 0) <= LOW_STOCK_THRESHOLD && " ⚠️"}
                {isAdmin && <React.Fragment> · 成本 ${fmt(costs[p.id] ?? 0)}</React.Fragment>}
              </div>
            </div>
            {isAdmin && (
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => openEdit(p)} style={styles.smallBtn}>編輯</button>
                <button onClick={() => handleDelete(p.id)} style={{ ...styles.smallBtn, color: "#a85454" }}>刪除</button>
              </div>
            )}
          </div>
          <div style={styles.tierDisplayRow}>
            {p.priceTiers.map((t) => (
              <div key={t.id} style={styles.tierDisplayChip}><span style={{ color: "#8a7f6a" }}>{t.label}</span><span style={{ fontWeight: 700, color: "#1f8f56", marginLeft: 6 }}>${fmt(t.value)}</span></div>
            ))}
          </div>
        </div>
      ))}

      {showForm && editing && (
        <div style={styles.modalOverlay} onClick={() => setShowForm(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#3a3327" }}>{editing.id ? "編輯產品" : "新增產品"}</div>
              <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", cursor: "pointer" }}><IX size={18} color="#a89b86" /></button>
            </div>

            <label style={styles.label}>產品名稱</label>
            <input style={styles.input} value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} placeholder="例如：A貨" />

            <label style={styles.label}>分類</label>
            <input style={styles.input} value={editing.category} onChange={(e) => setEditing({ ...editing, category: e.target.value })} placeholder="例如：飾物 / 電子 / 其他" />

            <div style={styles.rowGap}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <label style={styles.label}>成本價</label>
                <input style={styles.input} type="number" inputMode="decimal" value={editing.cost} onChange={(e) => setEditing({ ...editing, cost: e.target.value })} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <label style={styles.label}>目前存貨</label>
                <input style={styles.input} type="number" inputMode="decimal" value={editing.stock} onChange={(e) => setEditing({ ...editing, stock: e.target.value })} />
              </div>
            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, marginBottom: 6 }}>
              <label style={{ ...styles.label, marginTop: 0 }}>售價級別</label>
              <button onClick={() => setEditing({ ...editing, priceTiers: [...editing.priceTiers, { id: String(Date.now()), label: "", value: "" }] })} style={styles.addTierBtn}><IPlus size={12} /> 加級別</button>
            </div>

            {editing.priceTiers.map((t, i) => (
              <div key={t.id} style={styles.tierEditRow}>
                <input style={{ ...styles.input, flex: 1, marginBottom: 0 }} value={t.label} onChange={(e) => { const next = [...editing.priceTiers]; next[i] = { ...t, label: e.target.value }; setEditing({ ...editing, priceTiers: next }); }} placeholder="級別名稱" />
                <input style={{ ...styles.input, width: 90, marginBottom: 0 }} type="number" inputMode="decimal" value={t.value} onChange={(e) => { const next = [...editing.priceTiers]; next[i] = { ...t, value: e.target.value }; setEditing({ ...editing, priceTiers: next }); }} placeholder="價錢" />
                <button onClick={() => setEditing({ ...editing, priceTiers: editing.priceTiers.filter((x) => x.id !== t.id) })} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}><IX size={14} color="#c4b8a0" /></button>
              </div>
            ))}

            <button onClick={handleSave} style={{ ...styles.submitBtn, marginTop: 18 }}>儲存</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   STATS TAB
   ========================================================= */
function StatsTab({ orders, purchases, products, costs, isAdmin }) {
  const [period, setPeriod] = useState("month");
  const [expandedKey, setExpandedKey] = useState(null);
  const [projTierIdx, setProjTierIdx] = useState(0);

  const activeOrders = useMemo(() => orders.filter((o) => o.status !== "cancelled"), [orders]);

  const groups = useMemo(() => {
    const map = new Map();
    const put = (dateStr, amount, kind, ref) => {
      let key, label;
      if (period === "day") { key = dateStr; label = dateStr; }
      else if (period === "week") { key = getWeekKey(dateStr); label = weekLabel(key); }
      else { key = dateStr.slice(0, 7); label = key; }
      if (!map.has(key)) map.set(key, { key, label, in: 0, out: 0, orders: [], purchases: [] });
      const g = map.get(key);
      if (kind === "out") { g.out += amount; g.orders.push(ref); }
      else { g.in += amount; g.purchases.push(ref); }
    };
    activeOrders.forEach((o) => put(o.date, o.total, "out", o));
    if (isAdmin) purchases.forEach((p) => put(p.date, p.total, "in", p));
    return Array.from(map.values()).sort((a, b) => (a.key < b.key ? 1 : -1));
  }, [activeOrders, purchases, period, isAdmin]);

  const totals = useMemo(() => { const t = { in: 0, out: 0 }; groups.forEach((g) => { t.in += g.in; t.out += g.out; }); return t; }, [groups]);

  const categorySummary = useMemo(() => {
    const map = new Map();
    activeOrders.forEach((o) => (o.items || []).forEach((it) => {
      const prod = products.find((p) => p.id === it.productId);
      const cat = prod?.category || "未分類";
      if (!map.has(cat)) map.set(cat, { cat, qty: 0, revenue: 0, cost: 0 });
      const g = map.get(cat);
      g.qty += it.qty;
      g.revenue += it.unitPrice * it.qty;
      if (isAdmin) g.cost += (costs[it.productId] || 0) * it.qty;
    }));
    return Array.from(map.values()).sort((a, b) => b.revenue - a.revenue);
  }, [activeOrders, products, costs, isAdmin]);

  const realizedProfit = useMemo(() => {
    if (!isAdmin) return 0;
    let p = 0;
    activeOrders.forEach((o) => (o.items || []).forEach((it) => { p += (it.unitPrice - (costs[it.productId] || 0)) * it.qty; }));
    return p;
  }, [activeOrders, costs, isAdmin]);

  const todayStaffSummary = useMemo(() => {
    if (!isAdmin) return [];
    const today = todayStr();
    const map = new Map();
    activeOrders.filter((o) => o.date === today).forEach((o) => {
      const name = o.staffName || "未知";
      if (!map.has(name)) map.set(name, { name, count: 0, total: 0 });
      const g = map.get(name);
      g.count += 1; g.total += o.total;
    });
    return Array.from(map.values()).sort((a, b) => b.total - a.total);
  }, [activeOrders, isAdmin]);


  const potentialProfit = useMemo(() => {
    if (!isAdmin) return 0;
    let p = 0;
    products.forEach((prod) => {
      const tier = prod.priceTiers[projTierIdx] || prod.priceTiers[0];
      if (!tier) return;
      p += ((tier.value || 0) - (costs[prod.id] || 0)) * (prod.stock || 0);
    });
    return p;
  }, [products, costs, projTierIdx, isAdmin]);

  const periodLabel = { day: "日", week: "週", month: "月" };

  return (
    <div style={styles.tabContent}>
      <div style={styles.periodToggle}>
        {["day", "week", "month"].map((p) => (
          <button key={p} onClick={() => setPeriod(p)} style={{ ...styles.periodBtn, background: period === p ? "#16261f" : "transparent", color: period === p ? "#fdf8ef" : "#7a6f5c" }}>每{periodLabel[p]}</button>
        ))}
      </div>

      <div style={styles.summaryGrid}>
        {isAdmin && <div style={{ ...styles.summaryCard, borderColor: "#d6dcd3" }}><div style={styles.summaryLabel}>總入貨</div><div style={{ ...styles.summaryValue, color: "#16261f" }}>${fmt(totals.in)}</div></div>}
        <div style={{ ...styles.summaryCard, borderColor: "#d3e3da" }}><div style={styles.summaryLabel}>總售出</div><div style={{ ...styles.summaryValue, color: "#1f8f56" }}>${fmt(totals.out)}</div></div>
        {isAdmin && <div style={{ ...styles.summaryCard, borderColor: "#e4dbc9" }}><div style={styles.summaryLabel}>已實現利潤</div><div style={{ ...styles.summaryValue, color: realizedProfit >= 0 ? "#1f8f56" : "#16261f" }}>{realizedProfit >= 0 ? "+" : ""}${fmt(realizedProfit)}</div></div>}
      </div>

      {isAdmin && todayStaffSummary.length > 0 && (
        <div style={{ ...styles.card, marginBottom: 20 }}>
          <div style={styles.sectionTitle}>今日店員結算</div>
          {todayStaffSummary.map((s) => (
            <div key={s.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0" }}>
              <div style={{ fontSize: 13, color: "#3a3327" }}>{s.name} <span style={{ fontSize: 11, color: "#a89b86" }}>· {s.count}張單</span></div>
              <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#1f8f56" }}>${fmt(s.total)}</div>
            </div>
          ))}
        </div>
      )}

      {isAdmin && (
        <div style={{ ...styles.card, marginBottom: 20 }}>
          <div style={styles.sectionTitle}>可預計盈利</div>
          <div style={{ fontSize: 12, color: "#8a7f6a", marginBottom: 10 }}>假設現存所有存貨都以下面級別賣出：</div>
          <div style={styles.tierRow}>
            {(products[0]?.priceTiers || DEFAULT_TIERS).map((t, idx) => (
              <button key={idx} onClick={() => setProjTierIdx(idx)} style={{ ...styles.tierChip, borderColor: projTierIdx === idx ? "#1f8f56" : "#e4dbc9", background: projTierIdx === idx ? "#eef4f0" : "#fff", color: projTierIdx === idx ? "#1f8f56" : "#7a6f5c" }}>
                <div style={{ fontWeight: 700 }}>{t.label}</div>
              </button>
            ))}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 14, fontSize: 13, color: "#7a6f5c" }}>
            <span>存貨潛在利潤</span>
            <span style={{ fontFamily: "monospace", fontWeight: 700, color: potentialProfit >= 0 ? "#1f8f56" : "#16261f" }}>{potentialProfit >= 0 ? "+" : ""}${fmt(potentialProfit)}</span>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 6, paddingTop: 10, borderTop: "1px dashed #e4dbc9" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#3a3327" }}>已實現 + 潛在合計</span>
            <span style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 16, color: "#1f8f56" }}>${fmt(realizedProfit + potentialProfit)}</span>
          </div>
        </div>
      )}

      <div style={styles.sectionTitle}>產品分類總結</div>
      {categorySummary.length === 0 && <div style={styles.emptyHint}>未有銷售資料</div>}
      {categorySummary.map((c) => (
        <div key={c.cat} style={styles.catRow}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: "#3a3327" }}>{c.cat}</div>
            <div style={{ fontSize: 11, color: "#a89b86" }}>賣出 {c.qty} 件{isAdmin && ` · 利潤 $${fmt(c.revenue - c.cost)}`}</div>
          </div>
          <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#1f8f56" }}>${fmt(c.revenue)}</div>
        </div>
      ))}

      <div style={{ ...styles.sectionTitle, marginTop: 22 }}>{periodLabel[period]}明細</div>
      {groups.length === 0 && <div style={styles.emptyHint}>未有資料</div>}
      {groups.map((g) => {
        const expanded = expandedKey === g.key;
        const diff = g.out - g.in;
        return (
          <div key={g.key} style={styles.groupCard}>
            <button style={styles.groupHeader} onClick={() => setExpandedKey(expanded ? null : g.key)}>
              {expanded ? <IChevronDown size={13} color="#a89b86" /> : <IChevronRight size={13} color="#a89b86" />}
              <div style={{ flex: 1, textAlign: "left", marginLeft: 6 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#3a3327" }}>{g.label}</div>
                <div style={{ fontSize: 11, color: "#a89b86" }}>{isAdmin ? `入 $${fmt(g.in)} · ` : ""}售 ${fmt(g.out)}</div>
              </div>
              {isAdmin && <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 14, color: diff >= 0 ? "#1f8f56" : "#16261f" }}>{diff >= 0 ? "+" : ""}${fmt(diff)}</div>}
            </button>
            {expanded && (
              <div style={{ marginTop: 6 }}>
                {g.orders.map((o) => <OrderRow key={o.id} order={o} isAdmin={isAdmin} />)}
                {isAdmin && g.purchases.map((p) => (
                  <div key={p.id} style={styles.txRow}>
                    <div style={{ ...styles.txDot, background: "#16261f" }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 14, fontWeight: 600, color: "#3a3327" }}>{p.productName}</div>
                      <div style={{ fontSize: 11, color: "#a89b86" }}>{p.date} · {p.qty}件 × ${fmt(p.unitCost)}</div>
                    </div>
                    <div style={{ fontFamily: "monospace", fontWeight: 700, color: "#16261f" }}>-${fmt(p.total)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* =========================================================
   SETTINGS TAB — 店員管理 / 匯入 / 匯出 (admin only)
   ========================================================= */
function SettingsTab({ products, costs, orders, purchases, showToast }) {
  const [roles, setRoles] = useState([]);
  const [newUid, setNewUid] = useState("");
  const [newName, setNewName] = useState("");
  const [newRole, setNewRole] = useState("staff");
  const fileInputRef = useRef(null);

  useEffect(() => {
    const unsub = db.collection("roles").onSnapshot((snap) => setRoles(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);

  const addRole = async () => {
    if (!newUid.trim()) { showToast("請輸入UID"); return; }
    try {
      await db.collection("roles").doc(newUid.trim()).set({ name: newName.trim() || newUid.trim(), role: newRole });
      showToast("已新增角色"); setNewUid(""); setNewName("");
    } catch (e) { showToast("失敗：" + e.message); }
  };
  const removeRole = async (id) => {
    if (!window.confirm("確定移除呢個人嘅角色？")) return;
    await db.collection("roles").doc(id).delete();
  };

  const downloadBlob = (content, filename, type) => {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportJSON = () => {
    const payload = { exportedAt: new Date().toISOString(), products: products.map((p) => ({ ...p, cost: costs[p.id] ?? 0 })), orders, purchases };
    downloadBlob(JSON.stringify(payload, null, 2), `moneymoney備份_${todayStr()}.json`, "application/json");
    showToast("已匯出備份");
  };

  const exportCSV = () => {
    const header = ["日期", "類型", "產品", "級別/備註", "數量", "單價", "總額"];
    const rows = [];
    orders.forEach((o) => (o.items || []).forEach((it) => rows.push([o.date, "售出", it.productName, it.tierLabel, it.qty, it.unitPrice, it.unitPrice * it.qty])));
    purchases.forEach((p) => rows.push([p.date, "入貨", p.productName, p.note || "", p.qty, p.unitCost, p.total]));
    rows.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
    const csv = "\uFEFF" + [header, ...rows].map((r) => r.join(",")).join("\n");
    downloadBlob(csv, `moneymoney記錄_${todayStr()}.csv`, "text/csv;charset=utf-8");
    showToast("已匯出CSV");
  };

  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();
  const handleImportFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data.products) || !Array.isArray(data.transactions)) throw new Error("呢個唔係舊版嘅備份格式");
      if (!window.confirm(`即將匯入舊記錄：${data.products.length}個產品，${data.transactions.length}筆交易。呢個操作會喺Firestore度新增資料（唔會刪走而家已有嘅），繼續？`)) return;

      const oldIdToNewId = {};
      for (const p of data.products) {
        const ref = await db.collection("products").add({ name: p.name, category: "未分類", priceTiers: p.priceTiers.map((t) => ({ id: String(t.id), label: t.label, value: t.value })), stock: 0 });
        await db.collection("productCosts").doc(ref.id).set({ cost: p.cost || 0 });
        oldIdToNewId[p.id] = ref.id;
      }
      let stockDelta = {};
      for (const tx of data.transactions) {
        const newPid = oldIdToNewId[tx.productId];
        if (!newPid) continue;
        if (tx.type === "in") {
          await db.collection("purchases").add({ productId: newPid, productName: tx.productName, qty: tx.qty, unitCost: tx.unitPrice, total: tx.total, date: tx.date, note: tx.note || "", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          stockDelta[newPid] = (stockDelta[newPid] || 0) + tx.qty;
        } else {
          await db.collection("orders").add({ date: tx.date, note: tx.note || "", items: [{ productId: newPid, productName: tx.productName, tierId: "legacy", tierLabel: tx.tierLabel || "", unitPrice: tx.unitPrice, qty: tx.qty }], total: tx.total, staffUid: "import", staffName: "舊記錄匯入", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          stockDelta[newPid] = (stockDelta[newPid] || 0) - tx.qty;
        }
      }
      for (const pid of Object.keys(stockDelta)) {
        await db.collection("products").doc(pid).update({ stock: firebase.firestore.FieldValue.increment(stockDelta[pid]) });
      }
      showToast("匯入完成！");
    } catch (err) {
      showToast("匯入失敗：" + err.message);
    }
    e.target.value = "";
  };

  return (
    <div style={styles.tabContent}>
      <div style={styles.card}>
        <div style={styles.sectionTitle}>店員 / 角色管理</div>
        <div style={{ fontSize: 11, color: "#a89b86", marginBottom: 12, lineHeight: 1.5 }}>
          先喺Firebase Console → Authentication開返個email/密碼帳戶俾店員，複製佢個UID貼落面，就可以指派角色。
        </div>
        {roles.map((r) => (
          <div key={r.id} style={styles.roleRow}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#3a3327" }}>{r.name}</div>
              <div style={{ fontSize: 10, color: "#a89b86", fontFamily: "monospace" }}>{r.id}</div>
            </div>
            <div style={{ ...styles.tierDisplayChip, background: r.role === "admin" ? "#f7f1e3" : "#eef4f0" }}>{r.role === "admin" ? "管理員" : "店員"}</div>
            <button onClick={() => removeRole(r.id)} style={styles.deleteBtn}><ITrash size={13} color="#c4b8a0" /></button>
          </div>
        ))}
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px dashed #e4dbc9" }}>
          <label style={styles.label}>店員UID</label>
          <input style={styles.input} value={newUid} onChange={(e) => setNewUid(e.target.value)} placeholder="喺Firebase Authentication度複製" />
          <label style={styles.label}>顯示名稱</label>
          <input style={styles.input} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="例如：阿明" />
          <label style={styles.label}>角色</label>
          <select style={styles.select} value={newRole} onChange={(e) => setNewRole(e.target.value)}>
            <option value="staff">店員</option>
            <option value="admin">管理員</option>
          </select>
          <button onClick={addRole} style={{ ...styles.submitBtn, marginTop: 14 }}><IPlus size={15} /> 新增角色</button>
        </div>
      </div>

      <div style={{ ...styles.card, marginTop: 16 }}>
        <div style={styles.sectionTitle}>備份 / 匯出</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={exportJSON} style={styles.exportBtn}>匯出備份 (JSON)</button>
          <button onClick={exportCSV} style={styles.exportBtn}>匯出CSV (Excel)</button>
        </div>
      </div>

      <div style={{ ...styles.card, marginTop: 16 }}>
        <div style={styles.sectionTitle}>匯入舊版記錄</div>
        <div style={{ fontSize: 11, color: "#a89b86", marginBottom: 10, lineHeight: 1.5 }}>
          揀返之前舊版（本機/localStorage版）匯出嘅JSON備份檔案，會將產品同交易記錄轉移落嚟。
        </div>
        <button onClick={triggerImport} style={{ ...styles.exportBtn, background: "#fff", color: "#7a6f5c" }}>揀檔案匯入</button>
        <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: "none" }} />
      </div>
    </div>
  );
}
