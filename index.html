<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>入貨 · 出貨記帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2316261f%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22monospace%22 font-weight=%22800%22 fill=%22%23d9f0e2%22 text-anchor=%22middle%22>H</text></svg>">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #fdf8ef; }
  body { font-family: 'Noto Sans HK', 'PingFang HK', -apple-system, sans-serif; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5) sepia(0.3); }
  ::placeholder { color: #c4b8a0; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// ---------- local storage shim (mirrors the Claude artifact storage API) ----------
const LS_PREFIX = "hledger:";
const storage = {
  async get(key) {
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
};

// ---------- helpers ----------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmt = (n) => (Math.round((n + Number.EPSILON) * 100) / 100).toLocaleString("zh-HK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function getWeekKey(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);
  return monday.toISOString().slice(0, 10);
}
function weekLabel(mondayStr) {
  const m = new Date(mondayStr + "T00:00:00");
  const s = new Date(m);
  s.setDate(m.getDate() + 6);
  const f = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
  return `${f(m)} - ${f(s)}`;
}

const DEFAULT_TIERS = [
  { id: "t1", label: "原價", value: 0 },
  { id: "t2", label: "75折", value: 0 },
  { id: "t3", label: "65折", value: 0 },
];

// ---------- tiny inline icons (no external icon lib needed) ----------
const Icon = ({ children, size = 16, color = "currentColor", style }) => (
  <span style={{ fontSize: size, color, lineHeight: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", ...style }}>{children}</span>
);
const IPlus = (p) => <Icon {...p}>＋</Icon>;
const ITrash = (p) => <Icon {...p}>🗑</Icon>;
const IUp = (p) => <Icon {...p}>↑</Icon>;
const IDown = (p) => <Icon {...p}>↓</Icon>;
const IPackage = (p) => <Icon {...p} size={p.size || 34}>📦</Icon>;
const IBook = (p) => <Icon {...p}>📗</Icon>;
const IChart = (p) => <Icon {...p}>📊</Icon>;
const IX = (p) => <Icon {...p}>✕</Icon>;
const IChevronDown = (p) => <Icon {...p}>▾</Icon>;
const IChevronRight = (p) => <Icon {...p}>▸</Icon>;

function App() {
  const [tab, setTab] = useState("record");
  const [products, setProducts] = useState(null);
  const [transactions, setTransactions] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  }, []);

  useEffect(() => {
    (async () => {
      let p = [];
      let t = [];
      try { const r = await storage.get("products"); if (r && r.value) p = JSON.parse(r.value); } catch (e) {}
      try { const r = await storage.get("transactions"); if (r && r.value) t = JSON.parse(r.value); } catch (e) {}
      setProducts(p);
      setTransactions(t);
      setLoaded(true);
    })();
  }, []);

  const saveProducts = useCallback(async (next) => {
    setProducts(next);
    try { await storage.set("products", JSON.stringify(next)); } catch (e) { showToast("儲存失敗，請重試"); }
  }, [showToast]);

  const saveTransactions = useCallback(async (next) => {
    setTransactions(next);
    try { await storage.set("transactions", JSON.stringify(next)); } catch (e) { showToast("儲存失敗，請重試"); }
  }, [showToast]);

  if (!loaded) {
    return (
      <div style={styles.loadingScreen}>
        <div style={styles.loadingMark}>H</div>
        <div style={{ color: "#8a7f6a", fontSize: 13, letterSpacing: 1 }}>載入中…</div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      <Header />
      <div style={styles.body}>
        {tab === "record" && <RecordTab products={products} transactions={transactions} saveTransactions={saveTransactions} showToast={showToast} />}
        {tab === "products" && <ProductsTab products={products} saveProducts={saveProducts} showToast={showToast} />}
        {tab === "stats" && <StatsTab transactions={transactions} products={products} saveProducts={saveProducts} saveTransactions={saveTransactions} showToast={showToast} />}
      </div>
      <NavBar tab={tab} setTab={setTab} />
      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function Header() {
  return (
    <div style={styles.header}>
      <div style={styles.headerStamp}>H</div>
      <div>
        <div style={styles.headerTitle}>入貨 · 出貨記帳</div>
        <div style={styles.headerSub}>{todayStr()}</div>
      </div>
    </div>
  );
}

function NavBar({ tab, setTab }) {
  const items = [
    { id: "record", label: "記錄", icon: IBook },
    { id: "products", label: "產品", icon: IPackage },
    { id: "stats", label: "統計", icon: IChart },
  ];
  return (
    <div style={styles.nav}>
      {items.map(({ id, label, icon: Ic }) => {
        const active = tab === id;
        return (
          <button key={id} onClick={() => setTab(id)} style={{ ...styles.navBtn, color: active ? "#16261f" : "#a89b86" }}>
            <Ic size={19} />
            <span style={{ fontSize: 11, marginTop: 3, fontWeight: active ? 700 : 500 }}>{label}</span>
            {active && <div style={styles.navIndicator} />}
          </button>
        );
      })}
    </div>
  );
}

// ================= RECORD TAB =================
function RecordTab({ products, transactions, saveTransactions, showToast }) {
  const [type, setType] = useState("out");
  const [productId, setProductId] = useState(products[0]?.id || "");
  const [qty, setQty] = useState("1");
  const [tierId, setTierId] = useState(products[0]?.priceTiers?.[0]?.id || "");
  const [customPrice, setCustomPrice] = useState("");
  const [useCustom, setUseCustom] = useState(false);
  const [date, setDate] = useState(todayStr());
  const [note, setNote] = useState("");

  useEffect(() => {
    if (products.length && !products.find((p) => p.id === productId)) setProductId(products[0].id);
  }, [products]); // eslint-disable-line

  const product = products.find((p) => p.id === productId);

  useEffect(() => {
    if (product && product.priceTiers?.length) setTierId(product.priceTiers[0].id);
  }, [productId]); // eslint-disable-line

  if (!products.length) {
    return (
      <div style={styles.emptyState}>
        <IPackage />
        <div style={{ marginTop: 10, color: "#7a6f5c", fontSize: 14 }}>未有產品</div>
        <div style={{ color: "#a89b86", fontSize: 12, marginTop: 4 }}>先去「產品」分頁新增產品，先可以記錄</div>
      </div>
    );
  }

  const unitPrice = type === "in" ? (product?.cost || 0) : (useCustom ? (parseFloat(customPrice) || 0) : (product?.priceTiers?.find((t) => t.id === tierId)?.value || 0));
  const qtyNum = parseFloat(qty) || 0;
  const total = unitPrice * qtyNum;

  const handleSubmit = async () => {
    if (!product) return;
    if (qtyNum <= 0) { showToast("請輸入數量"); return; }
    if (unitPrice <= 0) { showToast("請輸入價錢"); return; }
    const entry = {
      id: uid(), type, productId: product.id, productName: product.name, qty: qtyNum, unitPrice, total,
      tierLabel: type === "out" ? (useCustom ? "自訂" : (product.priceTiers.find((t) => t.id === tierId)?.label || "")) : "",
      date, note: note.trim(), createdAt: Date.now(),
    };
    await saveTransactions([entry, ...transactions]);
    showToast(type === "in" ? "已記錄入貨" : "已記錄售出");
    setQty("1"); setNote(""); setCustomPrice(""); setUseCustom(false);
  };

  const recent = transactions.slice(0, 8);

  return (
    <div style={styles.tabContent}>
      <div style={styles.typeToggle}>
        <button onClick={() => setType("in")} style={{ ...styles.typeBtn, background: type === "in" ? "#16261f" : "transparent", color: type === "in" ? "#fdf8ef" : "#16261f" }}>
          <IDown size={15} /> 入貨
        </button>
        <button onClick={() => setType("out")} style={{ ...styles.typeBtn, background: type === "out" ? "#1f8f56" : "transparent", color: type === "out" ? "#fdf8ef" : "#1f8f56" }}>
          <IUp size={15} /> 售出
        </button>
      </div>

      <div style={styles.card}>
        <label style={styles.label}>產品</label>
        <select style={styles.select} value={productId} onChange={(e) => setProductId(e.target.value)}>
          {products.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>

        {type === "out" && product?.priceTiers?.length > 0 && (
          <React.Fragment>
            <label style={styles.label}>售價級別</label>
            <div style={styles.tierRow}>
              {product.priceTiers.map((t) => (
                <button key={t.id} onClick={() => { setTierId(t.id); setUseCustom(false); }}
                  style={{ ...styles.tierChip, borderColor: !useCustom && tierId === t.id ? "#1f8f56" : "#e4dbc9", background: !useCustom && tierId === t.id ? "#eef4f0" : "#fff", color: !useCustom && tierId === t.id ? "#1f8f56" : "#7a6f5c" }}>
                  <div style={{ fontWeight: 700 }}>{t.label}</div>
                  <div style={{ fontSize: 11, opacity: 0.8 }}>${fmt(t.value)}</div>
                </button>
              ))}
              <button onClick={() => setUseCustom(true)} style={{ ...styles.tierChip, borderColor: useCustom ? "#1f8f56" : "#e4dbc9", background: useCustom ? "#eef4f0" : "#fff", color: useCustom ? "#1f8f56" : "#7a6f5c" }}>
                <div style={{ fontWeight: 700 }}>自訂</div>
              </button>
            </div>
            {useCustom && <input style={{ ...styles.input, marginTop: 8 }} type="number" inputMode="decimal" placeholder="自訂售價" value={customPrice} onChange={(e) => setCustomPrice(e.target.value)} />}
          </React.Fragment>
        )}

        {type === "in" && <div style={styles.costPreview}>成本價：<b>${fmt(product?.cost || 0)}</b> / 件</div>}

        <div style={styles.rowGap}>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>數量</label>
            <input style={styles.input} type="number" inputMode="decimal" value={qty} onChange={(e) => setQty(e.target.value)} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.label}>日期</label>
            <input style={styles.input} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        </div>

        <label style={styles.label}>備註（可選）</label>
        <input style={styles.input} value={note} onChange={(e) => setNote(e.target.value)} placeholder="例如：客戶名/批次" />

        <div style={styles.totalBar}>
          <span style={{ color: "#8a7f6a", fontSize: 13 }}>總金額</span>
          <span style={{ fontSize: 22, fontWeight: 800, color: type === "in" ? "#16261f" : "#1f8f56", fontFamily: "monospace" }}>${fmt(total)}</span>
        </div>

        <button onClick={handleSubmit} style={styles.submitBtn}><IPlus size={17} /> 儲存記錄</button>
      </div>

      <div style={{ marginTop: 22 }}>
        <div style={styles.sectionTitle}>最近記錄</div>
        {recent.length === 0 && <div style={styles.emptyHint}>未有記錄</div>}
        {recent.map((tx) => (
          <TxRow key={tx.id} tx={tx} onDelete={async () => { await saveTransactions(transactions.filter((t) => t.id !== tx.id)); showToast("已刪除"); }} />
        ))}
      </div>
    </div>
  );
}

function TxRow({ tx, onDelete }) {
  const isIn = tx.type === "in";
  return (
    <div style={styles.txRow}>
      <div style={{ ...styles.txDot, background: isIn ? "#16261f" : "#1f8f56" }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: "#3a3327", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
          {tx.productName} {tx.tierLabel && <span style={{ fontSize: 11, color: "#a89b86" }}>· {tx.tierLabel}</span>}
        </div>
        <div style={{ fontSize: 11, color: "#a89b86" }}>{tx.date} · {tx.qty} 件 × ${fmt(tx.unitPrice)} {tx.note && `· ${tx.note}`}</div>
      </div>
      <div style={{ fontFamily: "monospace", fontWeight: 700, color: isIn ? "#16261f" : "#1f8f56", fontSize: 14 }}>{isIn ? "-" : "+"}${fmt(tx.total)}</div>
      <button onClick={onDelete} style={styles.deleteBtn}><ITrash size={14} color="#c4b8a0" /></button>
    </div>
  );
}

// ================= PRODUCTS TAB =================
function ProductsTab({ products, saveProducts, showToast }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const openNew = () => { setEditing({ id: uid(), name: "", cost: "", priceTiers: DEFAULT_TIERS.map((t) => ({ ...t, id: uid(), value: "" })) }); setShowForm(true); };
  const openEdit = (p) => { setEditing({ ...p, cost: String(p.cost), priceTiers: p.priceTiers.map((t) => ({ ...t, value: String(t.value) })) }); setShowForm(true); };

  const handleSave = async () => {
    if (!editing.name.trim()) { showToast("請輸入產品名稱"); return; }
    const clean = { ...editing, name: editing.name.trim(), cost: parseFloat(editing.cost) || 0, priceTiers: editing.priceTiers.map((t) => ({ ...t, label: t.label.trim() || "級別", value: parseFloat(t.value) || 0 })) };
    const exists = products.find((p) => p.id === clean.id);
    const next = exists ? products.map((p) => (p.id === clean.id ? clean : p)) : [...products, clean];
    await saveProducts(next);
    setShowForm(false); setEditing(null); showToast("已儲存產品");
  };

  const handleDelete = async (id) => { await saveProducts(products.filter((p) => p.id !== id)); showToast("已刪除產品"); };

  return (
    <div style={styles.tabContent}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={styles.sectionTitle}>產品列表</div>
        <button onClick={openNew} style={styles.addProductBtn}><IPlus size={15} /> 新增產品</button>
      </div>

      {products.length === 0 && (
        <div style={styles.emptyState}>
          <IPackage />
          <div style={{ marginTop: 10, color: "#7a6f5c", fontSize: 14 }}>未有產品</div>
          <div style={{ color: "#a89b86", fontSize: 12, marginTop: 4 }}>撳「新增產品」開始設定成本同售價級別</div>
        </div>
      )}

      {products.map((p) => (
        <div key={p.id} style={styles.productCard}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#3a3327" }}>{p.name}</div>
              <div style={{ fontSize: 12, color: "#a89b86", marginTop: 2 }}>成本 ${fmt(p.cost)}</div>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => openEdit(p)} style={styles.smallBtn}>編輯</button>
              <button onClick={() => handleDelete(p.id)} style={{ ...styles.smallBtn, color: "#a85454" }}>刪除</button>
            </div>
          </div>
          <div style={styles.tierDisplayRow}>
            {p.priceTiers.map((t) => (
              <div key={t.id} style={styles.tierDisplayChip}><span style={{ color: "#8a7f6a" }}>{t.label}</span><span style={{ fontWeight: 700, color: "#1f8f56", marginLeft: 6 }}>${fmt(t.value)}</span></div>
            ))}
          </div>
        </div>
      ))}

      {showForm && editing && (
        <div style={styles.modalOverlay} onClick={() => setShowForm(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#3a3327" }}>{products.find((p) => p.id === editing.id) ? "編輯產品" : "新增產品"}</div>
              <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", cursor: "pointer" }}><IX size={18} color="#a89b86" /></button>
            </div>

            <label style={styles.label}>產品名稱</label>
            <input style={styles.input} value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} placeholder="例如：A貨" />

            <label style={styles.label}>成本價（入貨價）</label>
            <input style={styles.input} type="number" inputMode="decimal" value={editing.cost} onChange={(e) => setEditing({ ...editing, cost: e.target.value })} placeholder="0.00" />

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14, marginBottom: 6 }}>
              <label style={{ ...styles.label, marginTop: 0 }}>售價級別</label>
              <button onClick={() => setEditing({ ...editing, priceTiers: [...editing.priceTiers, { id: uid(), label: "", value: "" }] })} style={styles.addTierBtn}><IPlus size={12} /> 加級別</button>
            </div>

            {editing.priceTiers.map((t, i) => (
              <div key={t.id} style={styles.tierEditRow}>
                <input style={{ ...styles.input, flex: 1, marginBottom: 0 }} value={t.label} onChange={(e) => { const next = [...editing.priceTiers]; next[i] = { ...t, label: e.target.value }; setEditing({ ...editing, priceTiers: next }); }} placeholder="級別名稱（如 75折）" />
                <input style={{ ...styles.input, width: 90, marginBottom: 0 }} type="number" inputMode="decimal" value={t.value} onChange={(e) => { const next = [...editing.priceTiers]; next[i] = { ...t, value: e.target.value }; setEditing({ ...editing, priceTiers: next }); }} placeholder="價錢" />
                <button onClick={() => setEditing({ ...editing, priceTiers: editing.priceTiers.filter((x) => x.id !== t.id) })} style={{ background: "none", border: "none", cursor: "pointer", padding: 4 }}><IX size={14} color="#c4b8a0" /></button>
              </div>
            ))}

            <button onClick={handleSave} style={{ ...styles.submitBtn, marginTop: 18 }}>儲存</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ================= STATS TAB =================
function StatsTab({ transactions, products, saveProducts, saveTransactions, showToast }) {
  const [period, setPeriod] = useState("month");
  const [expandedKey, setExpandedKey] = useState(null);
  const fileInputRef = React.useRef(null);

  const downloadBlob = (content, filename, type) => {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportJSON = () => {
    const payload = { exportedAt: new Date().toISOString(), products, transactions };
    downloadBlob(JSON.stringify(payload, null, 2), `記帳備份_${todayStr()}.json`, "application/json");
    showToast("已匯出備份檔");
  };

  const exportCSV = () => {
    const header = ["日期", "類型", "產品", "級別", "數量", "單價", "總額", "備註"];
    const rows = transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).map((tx) => [
      tx.date, tx.type === "in" ? "入貨" : "售出", tx.productName, tx.tierLabel || "", tx.qty, tx.unitPrice, tx.total, (tx.note || "").replace(/,/g, "，"),
    ]);
    const csv = "\uFEFF" + [header, ...rows].map((r) => r.join(",")).join("\n");
    downloadBlob(csv, `記帳記錄_${todayStr()}.csv`, "text/csv;charset=utf-8");
    showToast("已匯出CSV");
  };

  const triggerImport = () => fileInputRef.current && fileInputRef.current.click();

  const handleImportFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data.products) || !Array.isArray(data.transactions)) throw new Error("format");
      if (!window.confirm(`匯入將會覆蓋現有資料（${data.products.length}個產品，${data.transactions.length}筆記錄）。繼續？`)) return;
      await saveProducts(data.products);
      await saveTransactions(data.transactions);
      showToast("已匯入備份");
    } catch (err) {
      showToast("匯入失敗，檔案格式不正確");
    }
    e.target.value = "";
  };

  const groups = useMemo(() => {
    const map = new Map();
    for (const tx of transactions) {
      let key, label;
      if (period === "day") { key = tx.date; label = tx.date; }
      else if (period === "week") { key = getWeekKey(tx.date); label = weekLabel(key); }
      else { key = tx.date.slice(0, 7); label = key; }
      if (!map.has(key)) map.set(key, { key, label, in: 0, out: 0, txs: [] });
      const g = map.get(key);
      if (tx.type === "in") g.in += tx.total; else g.out += tx.total;
      g.txs.push(tx);
    }
    return Array.from(map.values()).sort((a, b) => (a.key < b.key ? 1 : -1));
  }, [transactions, period]);

  const totals = useMemo(() => { const t = { in: 0, out: 0 }; for (const g of groups) { t.in += g.in; t.out += g.out; } return t; }, [groups]);
  const periodLabel = { day: "日", week: "週", month: "月" };

  return (
    <div style={styles.tabContent}>
      <div style={styles.periodToggle}>
        {["day", "week", "month"].map((p) => (
          <button key={p} onClick={() => setPeriod(p)} style={{ ...styles.periodBtn, background: period === p ? "#16261f" : "transparent", color: period === p ? "#fdf8ef" : "#7a6f5c" }}>每{periodLabel[p]}</button>
        ))}
      </div>

      <div style={styles.summaryGrid}>
        <div style={{ ...styles.summaryCard, borderColor: "#d6dcd3" }}><div style={styles.summaryLabel}>總入貨</div><div style={{ ...styles.summaryValue, color: "#16261f" }}>${fmt(totals.in)}</div></div>
        <div style={{ ...styles.summaryCard, borderColor: "#d3e3da" }}><div style={styles.summaryLabel}>總售出</div><div style={{ ...styles.summaryValue, color: "#1f8f56" }}>${fmt(totals.out)}</div></div>
        <div style={{ ...styles.summaryCard, borderColor: "#e4dbc9" }}><div style={styles.summaryLabel}>差額</div><div style={{ ...styles.summaryValue, color: totals.out - totals.in >= 0 ? "#1f8f56" : "#16261f" }}>{totals.out - totals.in >= 0 ? "+" : ""}${fmt(totals.out - totals.in)}</div></div>
      </div>

      <div style={styles.sectionTitle}>{periodLabel[period]}明細</div>
      {groups.length === 0 && <div style={styles.emptyHint}>未有資料</div>}
      {groups.map((g) => {
        const expanded = expandedKey === g.key;
        const diff = g.out - g.in;
        return (
          <div key={g.key} style={styles.groupCard}>
            <button style={styles.groupHeader} onClick={() => setExpandedKey(expanded ? null : g.key)}>
              {expanded ? <IChevronDown size={14} color="#a89b86" /> : <IChevronRight size={14} color="#a89b86" />}
              <div style={{ flex: 1, textAlign: "left", marginLeft: 6 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#3a3327" }}>{g.label}</div>
                <div style={{ fontSize: 11, color: "#a89b86" }}>入 ${fmt(g.in)} · 售 ${fmt(g.out)}</div>
              </div>
              <div style={{ fontFamily: "monospace", fontWeight: 700, fontSize: 14, color: diff >= 0 ? "#1f8f56" : "#16261f" }}>{diff >= 0 ? "+" : ""}${fmt(diff)}</div>
            </button>
            {expanded && (
              <div style={{ marginTop: 6 }}>
                {g.txs.slice().sort((a, b) => b.createdAt - a.createdAt).map((tx) => <TxRow key={tx.id} tx={tx} onDelete={() => {}} />)}
              </div>
            )}
          </div>
        );
      })}

      <div style={styles.exportSection}>
        <div style={styles.sectionTitle}>備份 / 匯出</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={exportJSON} style={styles.exportBtn}>匯出備份 (JSON)</button>
          <button onClick={exportCSV} style={styles.exportBtn}>匯出CSV (Excel)</button>
          <button onClick={triggerImport} style={{ ...styles.exportBtn, background: "#fff", color: "#7a6f5c" }}>從備份還原</button>
          <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImportFile} style={{ display: "none" }} />
        </div>
        <div style={{ fontSize: 11, color: "#a89b86", marginTop: 8, lineHeight: 1.5 }}>
          JSON備份可以完整還原產品同記錄；CSV可以用Excel/Numbers開嚟睇同整表。資料存喺呢部裝置嘅瀏覽器入面，建議不時匯出備份，換裝置/清瀏覽器資料前記得先匯出。
        </div>
      </div>
    </div>
  );
}
